<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Задача динамічного програмування</title>
    <link rel="stylesheet" href="styles/style.scss">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link 
      rel="preconnect" 
      href="https://fonts.gstatic.com" 
      crossorigin
    >
    <link 
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;1,100;1,200;1,300;1,400;1,500;1,600;1,700&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&family=Open+Sans:ital,wght@0,300..800;1,300..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" 
      rel="stylesheet"
    >
</head>
<body>
    <div class="calculate-LCS">
        <h1 class="calculate-LCS__topic">Найдовша спільна підпослідовність (LCS)</h1>
        
        <div class="calculate-LCS__description">
            <p class="calculate-LCS__description-text">Цей алгоритм знаходить найдовшу спільну підпослідовність між двома рядками.</p>
            <p class="calculate-LCS__description-text">Наприклад, для рядків "ABCDE" і "ACE" найдовша спільна підпослідовність - "ACE".</p>
        </div>

        <div class="calculate-LCS__input-section input-section">
            <label 
              for="string1"
            >
              Перший рядок:
            </label>
            <input 
              type="text" 
              id="string1" 
              value="ABCDE"
              class="input-section__input"
            >
            <br><br>
            <label for="string2">Другий рядок:</label>
            <input 
              type="text" 
              id="string2" 
              value="ACE"
              class="input-section__input"
            >
            <br><br>
            <button 
              onclick="startVisualization()"
              class="input-section__button"
            >
              Знайти LCS
            </button>
        </div>

        <div 
          class="calculate-LCS__step-description" 
          id="currentStep"
        >
            <!-- Тут буде відображатися опис поточного кроку -->
        </div>

        <div class="calculate-LCS__matrix-container">
            <table id="dpMatrix"></table>
        </div>

        <div id="result"></div>
    </div>

    <script src="main.js"></script>
</body>
</html>
